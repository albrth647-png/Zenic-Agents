[package]
name = "zenic-pybridge"
version.workspace = true
edition.workspace = true
description = "PyO3 bridge — exposes Zenic Rust core to Python as _zenic_native"
authors = ["Zenic-Agents Team"]
license.workspace = true

[lib]
name = "_zenic_native"
crate-type = ["cdylib"]

[dependencies]
zenic-safety = { path = "../zenic-safety" }
zenic-proto = { path = "../zenic-proto" }
zenic-memory = { path = "../zenic-memory" }
zenic-tece = { path = "../zenic-tece" }
pyo3 = { version = "0.22", features = ["extension-module", "macros"], default-features = true }
blake3 = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
rusqlite = { workspace = true }
regex = { workspace = true }
once_cell = "1"
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
indexmap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
native-tls = "0.2"
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
